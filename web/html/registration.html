<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Фермерская площадка</title>
    <link rel="stylesheet" href="/web/css/registration.css">
</head>

<body>
    <div class="arc arc-1"></div>
    <div class="arc arc-2"></div>
    <div class="arc arc-3"></div>
    <div class="arc arc-4"></div>

    <div class="registration-container">
        <label for="phone-input" class="label-text">PHONE NUMBER</label>

        <div class="input-wrapper">
            <span class="country-code">+994</span>
            <input type="tel" id="phone-input" placeholder="(__) ___-__-__" maxlength="9">
            <button id="submit-btn" class="arrow-button">
                <span>&#10141;</span>
            </button>
        </div>
    </div>

    <script src="/web/js/registration.js"></script>
</body>

</html>

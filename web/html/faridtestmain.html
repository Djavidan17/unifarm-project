<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroTrade | Premium Marketplace</title>
    <link rel="stylesheet" href="/web/css/faridtestmain.css">
</head>
<body>
    <div class="luxury-bg">
        <div class="blob b-1"></div>
        <div class="blob b-2"></div>
        <div class="blob b-3"></div>
    </div>

    <header class="navbar">
        <div class="nav-content">
            <div class="nav-left">
                <div class="burger-icon" id="sidebarToggle">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>
                <div class="logo">FARM<span>ERR</span></div>
            </div>

            <div class="nav-center">
                <div class="search-wrapper">
                    <input type="text" placeholder="Поиск продуктов природы..." id="mainSearch">
                    <button class="search-trigger">ИСКАТЬ</button>
                </div>
            </div>

           <div class="nav-right">
    <a href="/web/html/faridtestprofile.html" 
       class="nav-link-box" 
       onclick="window.location.href='/web/html/faridtestprofile.html'; return true;">
       PROFIL
    </a>
    <div class="nav-link-box lang-box">AZ / RU</div>
</div>
    </header>

    <div class="container">
        <aside class="side-menu" id="sideMenu">
            <div class="side-inner">
                <h3 class="menu-label">Категории</h3>
                <nav class="cat-list">
                    <div class="cat-item-stub"><span>Овощи</span></div>
                    <div class="cat-item-stub"><span>Фрукты</span></div>
                    <div class="cat-item-stub"><span>Зерновые</span></div>
                    <div class="cat-item-stub"><span>Молочка</span></div>
                    <div class="cat-item-stub"><span>Мясо</span></div>
                </nav>
            </div>
        </aside>

        <section class="feed">
            <div class="feed-header">
                <h2 class="feed-title">рекомендации</h2>
                <div class="title-underline"></div>
            </div>
            
            <div class="products-grid">
                <div class="item-card">
                    <div class="item-img-placeholder">
                        <div class="img-badge">NEW</div>
                    </div>
                    <div class="item-meta">
                        <div class="item-price-glow">00.00 AZN</div>
                        <div class="item-title-line"></div>
                        <div class="item-title-line short"></div>
                        <div class="item-footer">
                            <span class="location">Baku, Azerbaijan</span>
                        </div>
                    </div>
                </div>
                <div class="item-card"></div>
                <div class="item-card"></div>
                <div class="item-card"></div>
                <div class="item-card"></div>
                <div class="item-card"></div>
                <div class="item-card"></div>
                <div class="item-card"></div>
            </div>
        </section>
    </div>

   <div class="sticky-action">
    <a href="/web/html/faridtestcreateadd.html" style="text-decoration: none;">
        <button class="add-post-btn">
            <span class="plus-icon">+</span> СОЗДАТЬ ОБЪЯВЛЕНИЕ
        </button>
    </a>
</div>

    <script src="/web/js/faridtestmain.js"></script>
</body>
</html>
